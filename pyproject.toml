[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ionff"
version = "0.1.0"
description = "Term-resolved fitting and validation of an ion-solvent force field: a small reference, fit, validate loop for Na+ in organic solvents and water"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "ase"]

[project.optional-dependencies]
md = ["openmm"]
plot = ["matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs psi4 or openmm"]
